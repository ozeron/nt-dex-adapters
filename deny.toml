[graph]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
yanked = "deny"
ignore = [
    # crypto-bigint 0.5 timing side channels. Reaches us only through
    # nautilus-hyperliquid's signing stack (alloy -> elliptic-curve), which a
    # data-only node never runs: no private keys are loaded. Pinned by
    # elliptic-curve 0.13; revisit on the next NautilusTrader upgrade, and
    # remove before adding any execution client.
    { id = "RUSTSEC-2026-0387", reason = "signing code unused by data-only node" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-2-Clause-Patent",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # NautilusTrader itself. Fine for private use; read the terms before
    # distributing binaries built from this workspace.
    "LGPL-3.0-only",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

# Ships an MIT LICENSE file but no SPDX `license` field in its manifest.
[[licenses.clarify]]
crate = "implied-vol"
expression = "MIT"
license-files = []

[bans]
# Duplicate versions come from NautilusTrader's own tree; not ours to fix.
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies between our own unpublished crates carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
